version: 1

# Edition data: venue/license/funding. Declares NO `exports:`: the
# complete typst export lives in the engine's paper-base.yml (myst merges exports by id
# whole-entry, so splitting fields here would race). Do NOT add `extends:`; compose()
# assembles the engine‹edition‹brand chain. `oak bootstrap` renames this file to
# `editions/<edition>.yml`.
project:
  subject: Article
  venue: CHANGE-ME Journal
  # Asserted to readers and to Zenodo, and the paper template seeds a matching LICENSE file.
  # Changing it here means replacing that LICENSE in each paper repo (it is not a frozen file,
  # so `oak upgrade` will not do it for you).
  license: CC-BY-4.0
  open_access: true
  # funding: |
  #   Your funder
