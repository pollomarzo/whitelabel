name: Journal site

# Builds and deploys the journal site to GitHub Pages, on every push to main.
# https://scholar.nexus/oaktree-sapling/reference/files#file-site-workflow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - run: npm install --no-audit --no-fund
      # myst exits 0 on a plugin that never loaded, so the exit code is not enough.
      - name: Build (and prove the gallery plugin loaded)
        env:
          BASE_URL: ${{ steps.pages.outputs.base_path }}
        run: |
          set -o pipefail
          npx myst build --html --strict 2>&1 | tee /tmp/myst-build.log
          if ! grep -q "Paper Gallery.*loaded" /tmp/myst-build.log; then
            echo "::error::the gallery plugin did not load: check the pinned plugin URL in myst.yml (a bad tag 404s silently)"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _build/html
      - id: d
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
