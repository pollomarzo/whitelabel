name: Paper CI

# Stage 1 of the preview: builds every PR and push with NO secrets and a read-only token, so
# fork PRs still get a full build. The DEPLOY is preview-deploy.yml, in base context. The Pages
# deploy (push to main) rides here behind a job-scoped token.
# https://scholar.nexus/oaktree-sapling/design/paper-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read # the untrusted build job never holds pages/id-token

concurrency:
  # Head repo as well as branch: two forks on a branch called `main` would otherwise cancel each
  # other, and `ci-main` alone collided with the push group, cancelling in-flight Pages deploys.
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}-{1}', github.event.pull_request.head.repo.full_name, github.head_ref) || 'ci-push-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build: # NO secrets, read-only token: safe for fork PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/engine
        with:
          args: build
      # upload-artifact stores a symlink's TARGET as a regular file, putting a runner-readable
      # file on the public preview. Note this file is the PR's own copy, so whoever plants the
      # symlink can delete this step in the same commit: a guard against accident, not intent.
      - name: Drop symlinks from the build output
        run: find _build/html -type l -delete
      - name: Stash PR number # workflow_run.pull_requests is EMPTY for forks
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: printf '%s\n' "$PR_NUMBER" > _build/html/.pr-number
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paper-build
          path: _build/html
          if-no-files-found: error
          include-hidden-files: true

  deploy-pages:
    if: ${{ github.event_name != 'pull_request' }}
    needs: build
    permissions: # deploy perms live HERE, not on the untrusted build job
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: paper-build
          path: site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: d
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
