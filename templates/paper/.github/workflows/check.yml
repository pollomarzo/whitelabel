name: Journal checks

# Stage 1 of the journal checks: compute only, no secrets, safe to run on a fork's content.
# `oak validate` reads the paper and writes a report to an artifact; nothing is posted from
# here. check-post.yml posts it from the base context.
#
# This job succeeds whenever a valid report exists, even a failing one, so Stage 2 always fires
# and posts the verdict that gates the merge. Only a crash that produces no report fails it.
#
# Why the flow is split, and what Stage 2 may take from the artifact this job writes:
# https://scholar.nexus/oaktree-sapling/design/paper-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read # checkout only; the untrusted compute job holds nothing else

concurrency:
  # Head repo as well as branch, for the reason in ci.yml: a cancelled Stage 1 uploads no
  # artifact, so Stage 2 never fires and the PR waits on a check that will never arrive.
  group: ${{ github.event_name == 'pull_request' && format('check-pr-{0}-{1}', github.event.pull_request.head.repo.full_name, github.head_ref) || 'check-push-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `oak validate` exits 1 on a blocking failure (its contract, used by the merge gate +
      # local runs). Here that must NOT fail Stage 1: we only need the report file. So the
      # step tolerates a nonzero exit; the guard below re-imposes "fail on a genuine crash".
      - id: validate
        continue-on-error: true
        uses: ./.github/actions/engine
        with:
          args: validate --report report.json

      # Last resort only: `oak validate` writes a failing report even for a usage error or an
      # unexpected throw, so reaching this branch means the engine died before it could write
      # anything at all. Point at the step that holds the real message rather than restating
      # "crash": a bare "no valid report" told the author nothing about what to fix.
      - name: Ensure a valid report was produced
        run: |
          if ! jq -e '.checkRun.conclusion' report.json >/dev/null 2>&1; then
            echo "::error::oak validate wrote no report at all. The engine died before it could report. The real error is in the '${{ steps.validate.outcome }}' validate step's log above; nothing was posted to the PR."
            exit 1
          fi
          echo "report ok; conclusion: $(jq -r '.checkRun.conclusion' report.json)"

      # Stash the PR number, which Stage 2 cannot get from its own event: workflow_run.pull_requests
      # is EMPTY for forks. The head sha used to be stashed here too and is not any more, because
      # Stage 2 has it as `workflow_run.head_sha` and this file is fork-controlled on a PR: a value
      # Stage 2 can read from its own event must never be taken from this artifact instead.
      - name: Record PR number
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "${{ github.event.pull_request.number }}" > pr-number
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: journal-checks
          path: |
            report.json
            head-sha
            pr-number
          if-no-files-found: error
