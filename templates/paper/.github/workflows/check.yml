name: Journal checks

# Stage 1: compute only, no secrets, safe on a fork's content. Writes a report to an artifact;
# check-post.yml posts it from the base context. Succeeds whenever a VALID report exists, even a
# failing one, so Stage 2 always fires; only a crash that produces none fails it.
# https://scholar.nexus/oaktree-sapling/design/paper-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read # checkout only; the untrusted compute job holds nothing else

concurrency:
  # Head repo as well as branch (see ci.yml): a cancelled Stage 1 uploads no artifact, so Stage 2
  # never fires and the PR waits on a check that never arrives.
  group: ${{ github.event_name == 'pull_request' && format('check-pr-{0}-{1}', github.event.pull_request.head.repo.full_name, github.head_ref) || 'check-push-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A blocking failure exits 1 by contract, which must NOT fail Stage 1: only the report
      # matters here. The guard below re-imposes "fail on a genuine crash".
      - id: validate
        continue-on-error: true
        uses: ./.github/actions/engine
        with:
          args: validate --report report.json

      # Reached only when the engine died before writing anything, since even a usage error
      # produces a report. Points at the step holding the real message.
      - name: Ensure a valid report was produced
        run: |
          if ! jq -e '.checkRun.conclusion' report.json >/dev/null 2>&1; then
            echo "::error::oak validate wrote no report at all. The engine died before it could report. The real error is in the '${{ steps.validate.outcome }}' validate step's log above; nothing was posted to the PR."
            exit 1
          fi
          echo "report ok; conclusion: $(jq -r '.checkRun.conclusion' report.json)"

      # Stage 2 cannot get this from its own event: workflow_run.pull_requests is EMPTY for forks.
      # Stage 2 takes the head sha from its OWN event and must never read it here: this file is
      # fork-controlled. It is still WRITTEN, unread, so that an upgrade PR whose Stage 2 is still
      # the previous version keeps working; drop it once no repo runs a shim older than v0.0.3.
      - name: Record PR number
        run: |
          echo "${{ github.event.pull_request.head.sha || github.sha }}" > head-sha
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "${{ github.event.pull_request.number }}" > pr-number
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: journal-checks
          path: |
            report.json
            head-sha
            pr-number
          if-no-files-found: error
