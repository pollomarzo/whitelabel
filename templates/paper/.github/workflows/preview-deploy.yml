name: Preview deploy

# Stage 2 of the preview: base context, so it holds the secret fork PRs never get. It ONLY
# deploys Stage 1's inert artifact and never rebuilds fork content, which would reopen the
# injection hole. Engine ref and action code come from the base default branch.
# https://scholar.nexus/oaktree-sapling/design/paper-ci

on:
  workflow_run:
    workflows: ["Paper CI"]
    types: [completed]

permissions:
  contents: read
  actions: read # download the cross-run artifact
  pull-requests: write # sticky preview comment + new-version reminder

concurrency:
  # head_branch alone collides across forks, so key on head repo too.
  group: preview-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      ${{ github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; BASE default branch ⇒ engine ref AND action code from base
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: paper-build
          path: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      # `.pr-number` is fork-controlled. Same two checks as check-post.yml: shape, then the PR
      # must be the one this run built.
      - id: pr-owner
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          [ -f site/.pr-number ] || exit 0
          pr=$(cat site/.pr-number)
          if [[ ! "$pr" =~ ^[0-9]{1,10}$ ]]; then
            echo "::error::.pr-number in the artifact is not a number; refusing to comment"
            exit 1
          fi
          pr_head=$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)
          if [ "$pr_head" != "$HEAD_SHA" ]; then
            echo "::error::PR #$pr heads at $pr_head, not the $HEAD_SHA this run built; refusing to comment"
            exit 1
          fi
        shell: bash

      # Deploys the inert artifact (stripping .pr-number first). With no Cloudflare secrets it
      # degrades to an artifact-link comment rather than failing. The new-version reminder runs
      # here too, where it has pull-requests: write.
      - uses: ./.github/actions/engine
        with:
          args: deploy-preview site
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Lets the degrade comment deep-link the run holding the artifact.
          PAPER_BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
