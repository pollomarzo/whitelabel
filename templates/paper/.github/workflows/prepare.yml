name: Prepare Zenodo deposit

# Editor dispatches DOI reservation. Reserves/reuses a draft and opens the
# one-file myst.yml PR writing project.doi/github/date; the CLI opens that PR
# itself via GH_TOKEN (no peter-evans action; the write is a YAML round-trip).
# `--sandbox` is an explicit human choice here; a prod prepare may replace a
# committed sandbox DOI.
#
# No `version` input: prepare is version-agnostic: it only reserves the concept DOI. The
# version is the tag, and it enters the deposit at publish time (publish.yml → `oak release`).

on:
  workflow_dispatch:
    inputs:
      sandbox:
        description: "Use the Zenodo sandbox (rehearsal) instead of production"
        type: boolean
        default: true

permissions:
  contents: write # commit the DOI PR branch
  pull-requests: write # open the DOI PR

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The two environments are separate on purpose, and a credential quietly crossing between
      # them is worse than a failed run. Both secrets go to the CLI under their own names below,
      # so this refuses early with a better message rather than being the only thing that does.
      - name: Refuse a sandbox run with no sandbox token
        if: ${{ inputs.sandbox && secrets.ZENODO_TOKEN_SANDBOX == '' }}
        run: |
          echo "::error::sandbox run requested but ZENODO_TOKEN_SANDBOX is not set; refusing to fall back to the production token"
          exit 1

      - uses: ./.github/actions/engine
        with:
          args: deposit prepare ${{ inputs.sandbox && '--sandbox' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ZENODO_TOKEN_SANDBOX: ${{ secrets.ZENODO_TOKEN_SANDBOX }}
