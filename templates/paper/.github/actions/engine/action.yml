name: engine
description: >-
  Resolve the engine ref from myst.yml, check out the pinned ENGINE repo at that ref,
  and dispatch a verb to it. The ONE place the pins live. Frozen +
  CODEOWNERS-gated; all *logic* lives behind the engine version, improvable by a bump.

inputs:
  args:
    description: "verb + args for the engine (e.g. 'build', 'release --tag v1.0.0')"
    required: true

runs:
  using: composite
  steps:
    # --- resolve the engine ref from the paper's own myst.yml (raw, pre-extends) ------
    # Quoted key form ["oaktree-sapling"]: an unquoted hyphenated key is yq-version
    # sensitive; explicit guard so a missing options block fails LOUDLY, not as a
    # baffling downstream checkout error.
    - id: ref
      shell: bash
      run: |
        ref=$(yq '.project.options["oaktree-sapling"].version // ""' myst.yml)
        if [ -z "$ref" ] || [ "$ref" = "null" ]; then
          echo "::error::project.options.oaktree-sapling.version missing from myst.yml"
          exit 1
        fi
        echo "ref=$ref" >> "$GITHUB_OUTPUT"

    # --- pins.yml = the single source of truth, read by CI *and* local oak --
    - id: pins
      shell: bash
      run: |
        pins=.github/actions/engine/pins.yml
        engine=$(yq '.engine_repo // ""' "$pins")
        if [ -z "$engine" ] || [ "$engine" = "null" ]; then
          echo "::error::engine_repo missing from $pins"
          exit 1
        fi
        echo "engine=$engine" >> "$GITHUB_OUTPUT"
        echo "instance=$(yq '.instance_repo // "."' "$pins")" >> "$GITHUB_OUTPUT"

    # --- dec. 23 / [R41]: the repo is pinned but the ref FLOATS, and a public engine resolves
    # refs/pull/N/merge too, i.e. an unmerged engine PR. run.sh's dist/cli.cjs check does not
    # stop that, because a PR can commit one. So refuse the classes that are not a published
    # line of the engine when the paper content is untrusted (a fork PR).
    # https://scholar.nexus/oaktree-sapling/design/paper-ci
    - id: refclass
      shell: bash
      env:
        REF: ${{ steps.ref.outputs.ref }}
        IS_FORK: ${{ github.event.pull_request.head.repo.fork || false }}
      run: |
        [ "$IS_FORK" = "true" ] || exit 0
        if printf '%s' "$REF" | grep -Eq '^refs/pull/[0-9]+/merge$|^[0-9a-fA-F]{40}$'; then
          echo "::error::engine ref '$REF' is a raw commit or an unmerged pull request. A fork PR may only build against a published engine ref; pin a released version in myst.yml."
          exit 1
        fi

    # --- check out ENGINE@ref. The repository is pinned and the ref is now class-checked above.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ steps.pins.outputs.engine }}
        ref: ${{ steps.ref.outputs.ref }}
        path: .engine

    # --- OPT-IN per-paper execution env only: micromamba iff the paper
    # ships paper-environment.yml. No file → no Python anywhere.
    - uses: mamba-org/setup-micromamba@ce51e99f4bb8a82ab7158c4dc59ef4634c59c4f9 # v3.1.0
      if: ${{ hashFiles('paper-environment.yml') != '' }}
      with:
        environment-file: paper-environment.yml
        cache-environment: true

    # --- dispatch. INSTANCE_REPO comes from pins.yml ('.' when co-located, repo=journal).
    # Debuggability: run.sh echoes what it resolved at the top of every run.
    - shell: bash
      env:
        INSTANCE_REPO: ${{ steps.pins.outputs.instance }}
      run: .engine/ci/run.sh ${{ inputs.args }}
