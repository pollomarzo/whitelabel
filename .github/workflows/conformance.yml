# conformance — release certification of the paper CI (plan-paper-ci-conformance.md).
#
# Drives the standing fixtures against an engine version V and asserts every shim path green
# (build/Pages, journal checks, fork-safe preview, deposit chain, self-bump). Deliberately NOT
# a required status check and NOT per-commit: it is a release/nightly gate (many real runs +
# workflow_run latency + external round-trips ≈ 15–40 min). Advisory for now; a promotion gate
# on a green cert is a later milestone (plan C5).
#
# Slice C0: only the `reset` job exists — idempotent teardown of a cert run's ephemeral state
# (cert-* branches/PRs, *-cert-* tags) so runs are repeatable. The build/PR/deposit jobs (C1+)
# land on top of this skeleton.
name: conformance

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Engine version under test (e.g. v0.0.0-dev.18). Certifies push→main when set."
        required: false
      only-reset:
        description: "Run just the teardown of prior cert state, then stop (ignore tag)."
        type: boolean
        default: false

# The harness holds ONLY the fixture-scoped PAT (CONFORMANCE_PAT); CF/Zenodo creds stay the
# fixture repo's own secrets, read back from the fixture run. The ambient GITHUB_TOKEN cannot
# drive the fixture (cross-repo reach + the recursion guard) — see plan §credentials.
permissions:
  contents: read

concurrency:
  group: conformance
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    # A cert run is a deliberate act: the PAT lives behind a required-reviewer environment
    # (personal-account interim home; org-shared secrets come with the open-scholar-nexus move).
    environment: conformance
    permissions:
      contents: write # attach the cert record to the engine tag's GH Release (ambient token)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # dist/cli.cjs is gitignored; the harness runs the engine's CURRENT bundle (the code under
      # review IS the harness), so build it before invoking `oak conformance`.
      - run: npm run bundle

      # With a `tag` and not only-reset: certify push→main + preview + deposit (`certify` resets
      # first and tears down after). Else: just reset. The certify exit code (0=CERTIFIED,
      # 1=FAILED, 2=INCONCLUSIVE) is stashed for the outcome step below.
      - name: Certify (or reset)
        id: cert
        env:
          GH_TOKEN: ${{ secrets.CONFORMANCE_PAT }}
          FIXTURE: ${{ vars.CONFORMANCE_FIXTURE_REPO }}
          TAG: ${{ inputs.tag }}
          ONLY_RESET: ${{ inputs.only-reset }}
          # Optional fork-PR preview phase — the second-account fork + its own PAT. When either is
          # unset (not yet provisioned) the flag is empty and the phase self-skips, so certs keep
          # working. The fork phase drives the fork via `gh api` under this PAT (not git), so it
          # needs no git-credential setup of its own.
          FORK_REPO: ${{ vars.CONFORMANCE_FORK_REPO }}
          CONFORMANCE_FORK_PAT: ${{ secrets.CONFORMANCE_FORK_PAT }}
        run: |
          # `oak upgrade --repo` clones the fixture and `git push`es a branch; a bare-GH_TOKEN
          # runner has no git credential helper, so teach git to use the PAT for github.com.
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          if [ "$ONLY_RESET" = "true" ] || [ -z "$TAG" ]; then
            node dist/cli.cjs conformance reset --repo "$FIXTURE"
            exit 0
          fi
          set +e
          node dist/cli.cjs conformance certify --repo "$FIXTURE" --tag "$TAG" --run-id "${{ github.run_id }}" --fork-repo "$FORK_REPO" --record cert.json
          echo "code=$?" >> "$GITHUB_OUTPUT"
          set -e

      # Persist the tag-keyed cert record on the engine release (the C5 promotion-gate seam). Uses
      # the ambient token — the fixture-scoped PAT can't write the engine repo.
      - name: Record cert verdict on the engine release
        if: ${{ inputs.tag != '' && inputs.only-reset != true && hashFiles('cert.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" cert.json --clobber

      # A cert FAILURE (1) reddens the run; an INCONCLUSIVE (2, third-party outage) does NOT —
      # "red must mean us". The verdict lives in the record + logs either way.
      - name: Reflect cert outcome
        if: ${{ inputs.tag != '' && inputs.only-reset != true }}
        env:
          CODE: ${{ steps.cert.outputs.code }}
        run: |
          echo "cert exit code: ${CODE:-<none>}"
          [ "$CODE" = "1" ] && exit 1 || exit 0

  # Remaining (not built): C5 promotion gate reading the cert record attached above. The fork PR
  # path is built (optional; self-skips until CONFORMANCE_FORK_REPO/PAT are provisioned).
