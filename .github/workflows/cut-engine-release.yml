name: cut-engine-release

# Builds oak, commits the build to a new tag (never to a branch) and creates the GitHub release.
# See RELEASING.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'vX.Y.Z, or vX.Y.Z-dev.N for a pre-release'
        required: true
      ref:
        description: 'Source ref or SHA (default: the branch this runs from)'
        required: false

permissions:
  contents: write

concurrency:
  group: cut-engine-release
  cancel-in-progress: false

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # No typst setup: the script fetches the version in typst.version [R66].
      - name: Cut the release
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: 'github-actions[bot]'
          GIT_AUTHOR_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
          VERSION: ${{ inputs.version }}
        run: scripts/cut-engine-release.sh "$VERSION"
