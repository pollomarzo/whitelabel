version: 1

# Engine-owned structural defaults for the optional WEBSITE (gallery) build
# (design §5). The website's brand — logo, css, nav, footer, favicon — lives in
# INSTANCE-CONFIG brand, NOT here (today's nexus.yml conflates them; this is the
# de-branded structural residue). `site.template` (the book-theme zip) is injected
# by compose() version-matched to the engine, so it is not hardcoded here either.
site:
  options:
    hide_toc: true
